name: Build AltStore Classic

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force update submodules recursively
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project AltStore.xcodeproj \
            -scheme AltStore \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/AltStore.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_PROVISIONING_PROFILE=""

      - name: Export Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -R build/AltStore.xcarchive/Products/Applications/AltStore.app build/Payload/
          cd build && zip -r AltStore-patched.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-patched-ipa
          path: build/AltStore-patched.ipa
